<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game-Z AI | دستیار هوشمند</title>
    <meta name="description" content="دستیار هوشمند Game-Z برای بررسی سیستم و راهنمایی" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="shortcut icon" href="./pictures/logo daiere.png" type="image/x-icon" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== PARTICLES BG ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 45, 85, 0.08);
            padding: 12px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s ease;
        }
        header.shrink {
            padding: 8px 8%;
            background: rgba(0, 0, 0, 0.95);
        }
        .logo {
            height: 44px;
            transition: 0.3s;
            filter: drop-shadow(0 0 20px rgba(255, 45, 85, 0.15));
        }
        header.shrink .logo {
            height: 34px;
        }

        nav {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        nav a {
            color: #c8c8c8;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            position: relative;
            padding: 4px 0;
            text-decoration: none;
            white-space: nowrap;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2.5px;
            background: linear-gradient(90deg, #FF2D55, #8B5CF6);
            transition: 0.3s ease;
            border-radius: 2px;
        }
        nav a:hover {
            color: #FF2D55;
        }
        nav a:hover::after {
            width: 100%;
        }
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
        }
        .ai-badge {
            background: linear-gradient(135deg, #FF2D55, #8B5CF6);
            color: #fff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.2);
            animation: badgePulse 2.5s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 45, 85, 0.15);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 45, 85, 0.35);
            }
        }

        /* ===== AI HERO ===== */
        .ai-hero {
            position: relative;
            z-index: 2;
            padding: 120px 8% 20px;
            text-align: center;
            background: radial-gradient(ellipse at 50% 20%, rgba(255, 45, 85, 0.06), transparent 70%);
        }
        .ai-hero h1 {
            font-size: 2.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FF2D55, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .ai-hero h1 i {
            font-size: 2.2rem;
            margin-left: 10px;
        }
        .ai-hero p {
            color: #aaa;
            font-size: 1rem;
            margin-top: 6px;
        }
        .ai-hero .glow-text {
            color: #8B5CF6;
            font-weight: 700;
        }

        /* ===== CHAT CONTAINER ===== */
        .chat-wrapper {
            position: relative;
            z-index: 2;
            max-width: 860px;
            margin: 10px auto 50px;
            padding: 0 8% 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            background: rgba(12, 8, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 45, 85, 0.06);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 520px;
            box-shadow: 0 8px 60px rgba(255, 45, 85, 0.04);
            transition: border-color 0.4s;
        }
        .chat-container:hover {
            border-color: rgba(255, 45, 85, 0.12);
        }

        /* ===== CHAT HEADER ===== */
        .chat-header {
            padding: 18px 24px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .chat-header .ai-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF2D55, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.2);
            flex-shrink: 0;
        }
        .chat-header .ai-info {
            flex: 1;
        }
        .chat-header .ai-info h3 {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .ai-info h3 .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse-dot 1.8s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }
        .chat-header .ai-info p {
            color: #888;
            font-size: 0.75rem;
        }
        .chat-header .ai-actions {
            display: flex;
            gap: 8px;
        }
        .chat-header .ai-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #888;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .chat-header .ai-actions button:hover {
            background: rgba(255, 45, 85, 0.08);
            border-color: rgba(255, 45, 85, 0.15);
            color: #fff;
        }

        /* ===== CHAT MESSAGES ===== */
        .chat-messages {
            flex: 1;
            padding: 18px 22px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 45, 85, 0.2);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 0.92rem;
            line-height: 1.7;
            animation: msgIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            word-break: break-word;
        }
        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .msg-bot {
            align-self: flex-start;
            background: rgba(18, 12, 28, 0.7);
            border: 1px solid rgba(255, 45, 85, 0.04);
            border-bottom-right-radius: 6px;
            color: #e0e0e0;
        }
        .msg-bot .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            color: #8B5CF6;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .msg-bot .msg-header i {
            font-size: 0.9rem;
        }

        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.15), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(255, 45, 85, 0.08);
            border-bottom-left-radius: 6px;
            color: #fff;
        }
        .msg-user .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            color: #FF2D55;
            font-weight: 700;
            font-size: 0.75rem;
        }

        .msg .msg-time {
            font-size: 0.6rem;
            color: #666;
            margin-top: 6px;
            text-align: left;
            direction: ltr;
        }

        /* ===== SYSTEM CHECK RESULT (in message) ===== */
        .sys-result {
            margin-top: 10px;
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sys-result .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .sys-result .row:last-child {
            border-bottom: none;
        }
        .sys-result .row .label {
            color: #888;
        }
        .sys-result .row .value {
            font-weight: 700;
        }
        .sys-result .row .value.good {
            color: #22c55e;
        }
        .sys-result .row .value.bad {
            color: #ff4444;
        }
        .sys-result .row .value.warn {
            color: #fbbf24;
        }
        .sys-result .fps-box {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.06), rgba(139, 92, 246, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .sys-result .fps-box .fps-num {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FF2D55, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== CHAT INPUT ===== */
        .chat-input-area {
            padding: 14px 22px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-input-area input {
            flex: 1;
            padding: 13px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            min-width: 120px;
        }
        .chat-input-area input:focus {
            border-color: #FF2D55;
            box-shadow: 0 0 30px rgba(255, 45, 85, 0.05);
        }
        .chat-input-area input::placeholder {
            color: #666;
        }
        .chat-input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-input-area .send-btn {
            padding: 13px 28px;
            border-radius: 40px;
            background: linear-gradient(135deg, #FF2D55, #8B5CF6);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .chat-input-area .send-btn:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 4px 35px rgba(255, 45, 85, 0.25);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .chat-input-area .send-btn i {
            font-size: 1rem;
        }

        /* ===== SUGGESTION CHIPS ===== */
        .suggestion-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0 6px;
            padding: 0 4px;
        }
        .suggestion-chips .chip {
            padding: 6px 18px;
            border-radius: 30px;
            background: rgba(255, 45, 85, 0.06);
            border: 1px solid rgba(255, 45, 85, 0.06);
            color: #aaa;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .suggestion-chips .chip:hover {
            background: rgba(255, 45, 85, 0.12);
            border-color: rgba(255, 45, 85, 0.15);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: rgba(18, 12, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 14px 22px;
            gap: 6px;
            align-items: center;
            color: #888;
            font-size: 0.85rem;
        }
        .typing-indicator.show {
            display: flex;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8B5CF6;
            margin: 0 2px;
            animation: typingDot 1.4s infinite both;
        }
        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingDot {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== BACK BUTTON ===== */
        .back-row {
            text-align: center;
            margin-top: 20px;
        }
        .back-btn {
            display: inline-block;
            padding: 12px 34px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }
        .back-btn i {
            margin-left: 8px;
        }

        /* ===== FOOTER ===== */
        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 28px 20px 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(0, 0, 0, 0.4);
            color: #555;
            font-size: 0.8rem;
            margin-top: auto;
        }
        footer .footer-icons {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-top: 10px;
        }
        footer .footer-icons a {
            color: #444;
            font-size: 1.4rem;
            transition: 0.3s;
        }
        footer .footer-icons a:hover {
            color: #FF2D55;
            transform: scale(1.15) translateY(-3px);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                padding: 10px 5%;
            }
            .logo {
                height: 36px;
            }
            .menu-toggle {
                display: block;
            }
            nav {
                display: none;
                flex-direction: column;
                width: 100%;
                padding-top: 14px;
                gap: 10px;
                align-items: stretch;
            }
            nav.open {
                display: flex;
            }
            nav a {
                font-size: 0.85rem;
                padding: 6px 0;
            }
            .ai-hero {
                padding: 110px 5% 16px;
            }
            .ai-hero h1 {
                font-size: 2rem;
            }
            .chat-wrapper {
                padding: 0 4% 20px;
            }
            .chat-container {
                height: 460px;
                border-radius: 24px;
            }
            .chat-messages {
                padding: 14px 16px;
            }
            .msg {
                max-width: 90%;
                font-size: 0.85rem;
                padding: 12px 16px;
            }
            .chat-input-area {
                padding: 12px 16px 16px;
                flex-wrap: wrap;
            }
            .chat-input-area input {
                font-size: 0.85rem;
                padding: 11px 16px;
                min-width: 100px;
            }
            .chat-input-area .send-btn {
                padding: 11px 20px;
                font-size: 0.85rem;
            }
            .chat-header {
                padding: 14px 18px;
            }
            .chat-header .ai-avatar {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
            .chat-header .ai-info h3 {
                font-size: 0.95rem;
            }
            .suggestion-chips .chip {
                font-size: 0.7rem;
                padding: 4px 14px;
            }
            .sys-result .row {
                font-size: 0.78rem;
            }
            .sys-result .fps-box {
                font-size: 0.95rem;
            }
            .sys-result .fps-box .fps-num {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .ai-hero h1 {
                font-size: 1.6rem;
            }
            .ai-hero p {
                font-size: 0.85rem;
            }
            .chat-container {
                height: 400px;
                border-radius: 20px;
            }
            .chat-messages {
                padding: 12px 12px;
                gap: 10px;
            }
            .msg {
                max-width: 95%;
                font-size: 0.8rem;
                padding: 10px 14px;
                border-radius: 16px;
            }
            .chat-input-area {
                padding: 10px 12px 14px;
                gap: 8px;
            }
            .chat-input-area input {
                font-size: 0.8rem;
                padding: 10px 14px;
                min-width: 80px;
            }
            .chat-input-area .send-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
            .chat-header .ai-info h3 {
                font-size: 0.85rem;
            }
            .chat-header .ai-actions button {
                width: 30px;
                height: 30px;
                font-size: 0.7rem;
            }
            .suggestion-chips {
                gap: 6px;
            }
            .suggestion-chips .chip {
                font-size: 0.65rem;
                padding: 4px 12px;
            }
            .sys-result {
                padding: 10px 14px;
            }
            .sys-result .row {
                font-size: 0.72rem;
                padding: 3px 0;
            }
            .sys-result .fps-box {
                font-size: 0.85rem;
                padding: 8px 12px;
            }
            .sys-result .fps-box .fps-num {
                font-size: 1.1rem;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 45, 85, 0.15);
            border-radius: 10px;
        }

        /* ===== UTILITY ===== */
        .text-gradient {
            background: linear-gradient(135deg, #FF2D55, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>

    <!-- ===== PARTICLES ===== -->
    <canvas id="particles-canvas"></canvas>

    <!-- ===== HEADER ===== -->
    <header id="mainHeader">
        <img src="./pictures/logo daiere.png" alt="Game-Z" class="logo" />
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <nav id="mainNav">
            <a href="index.html"><i class="fas fa-home"></i> خانه</a>
            <a href="maincraft.html"><i class="fas fa-cube"></i> ماینکرفت</a>
            <a href="cs2.html"><i class="fas fa-crosshairs"></i> CS2</a>
            <a href="gta6.html"><i class="fas fa-clock"></i> GTA 6</a>
            <span class="ai-badge"><i class="fas fa-robot"></i> AI</span>
        </nav>
    </header>

    <!-- ===== HERO ===== -->
    <section class="ai-hero">
        <h1><i class="fas fa-robot"></i> Game-Z AI</h1>
        <p>
            دستیار هوشمند <span class="glow-text">Game-Z</span> — بررسی سیستم، راهنمایی بازی‌ها و پاسخ به سوالات شما
        </p>
    </section>

    <!-- ===== CHAT ===== -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <!-- Header -->
            <div class="chat-header">
                <div class="ai-avatar">GZ</div>
                <div class="ai-info">
                    <h3>
                        Game-Z AI
                        <span class="status-dot"></span>
                        <span style="font-size:0.65rem;color:#22c55e;font-weight:400;">آنلاین</span>
                    </h3>
                    <p>دستیار هوشمند گیمینگ 🎮</p>
                </div>
                <div class="ai-actions">
                    <button onclick="clearChat()" title="پاک کردن چت"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome message will be injected by JS -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span style="color:#8B5CF6;font-weight:700;">Game-Z AI</span>
                <span style="color:#666;margin:0 4px;">در حال تایپ</span>
                <span class="dots">
                    <span></span><span></span><span></span>
                </span>

    <script>
        // ============================================================
        //  PARTICLES (same as other pages)
        // ============================================================
        (function() {
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 60;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2.4 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.35 + 0.08;
                    const hue = Math.random() * 60 + 320;
                    this.color = `hsla(${hue}, 80%, 65%, ${this.opacity})`;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255, 45, 85, 0.15)';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                }
            }
            for (let i = 0; i < COUNT; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update();
                    p.draw(); });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(139, 92, 246, ${0.04 * (1 - dist/120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // ============================================================
        //  HEADER SHRINK
        // ============================================================
        const header = document.getElementById('mainHeader');
        window.addEventListener('scroll', () => {
            header.classList.toggle('shrink', window.scrollY > 60);
        });

        // ============================================================
        //  MOBILE MENU
        // ============================================================
        const toggle = document.getElementById('menuToggle');
        const nav = document.getElementById('mainNav');
        if (toggle && nav) {
            toggle.addEventListener('click', () => nav.classList.toggle('open'));
            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => nav.classList.remove('open'));
            });
        }

        // ============================================================
        //  GAME SYSTEM REQUIREMENTS
        // ============================================================
        const GAME_REQS = {
            'ماینکرفت': {
                cpu: 'Intel Core i3 / AMD FX-6300',
                ram: '4 GB',
                gpu: 'Intel HD Graphics 4000 / NVIDIA GeForce GT 630',
                storage: '1 GB',
                recommended: {
                    cpu: 'Intel Core i5 / AMD Ryzen 3',
                    ram: '8 GB',
                    gpu: 'NVIDIA GeForce GTX 660 / AMD Radeon HD 7850',
                    storage: '2 GB'
                },
                fpsEstimate: (cpuScore, ram, gpuScore) => {
                    let base = 60;
                    if (cpuScore < 0.3) base -= 25;
                    if (ram < 4) base -= 30;
                    if (gpuScore < 0.3) base -= 25;
                    return Math.max(10, Math.min(120, base + Math.random() * 10 - 5));
                }
            },
            'CS2': {
                cpu: 'Intel Core i5-2500K / AMD FX-8350',
                ram: '8 GB',
                gpu: 'NVIDIA GeForce GTX 660 / AMD Radeon HD 7850',
                storage: '20 GB',
                recommended: {
                    cpu: 'Intel Core i7-6700K / AMD Ryzen 5 3600',
                    ram: '16 GB',
                    gpu: 'NVIDIA GeForce GTX 1060 / AMD Radeon RX 580',
                    storage: '25 GB'
                },
                fpsEstimate: (cpuScore, ram, gpuScore) => {
                    let base = 90;
                    if (cpuScore < 0.4) base -= 30;
                    if (ram < 8) base -= 25;
                    if (gpuScore < 0.4) base -= 30;
                    return Math.max(15, Math.min(200, base + Math.random() * 15 - 7));
                }
            },
            'CS 1.6': {
                cpu: 'Intel Pentium 4 / AMD Athlon XP',
                ram: '512 MB',
                gpu: 'DirectX 8 compatible',
                storage: '500 MB',
                recommended: {
                    cpu: 'Intel Core 2 Duo / AMD Athlon 64',
                    ram: '2 GB',
                    gpu: 'DirectX 9 compatible',
                    storage: '1 GB'
                },
                fpsEstimate: (cpuScore, ram, gpuScore) => {
                    let base = 120;
                    if (cpuScore < 0.2) base -= 40;
                    if (ram < 0.5) base -= 30;
                    if (gpuScore < 0.2) base -= 30;
                    return Math.max(20, Math.min(300, base + Math.random() * 20 - 10));
                }
            },
            'Rust': {
                cpu: 'Intel Core i7-3770 / AMD FX-9590',
                ram: '16 GB',
                gpu: 'NVIDIA GeForce GTX 980 / AMD Radeon R9 380',
                storage: '25 GB',
                recommended: {
                    cpu: 'Intel Core i7-8700K / AMD Ryzen 7 3700X',
                    ram: '32 GB',
                    gpu: 'NVIDIA GeForce RTX 2060 / AMD Radeon RX 5700',
                    storage: '30 GB'
                },
                fpsEstimate: (cpuScore, ram, gpuScore) => {
                    let base = 70;
                    if (cpuScore < 0.5) base -= 30;
                    if (ram < 16) base -= 25;
                    if (gpuScore < 0.5) base -= 30;
                    return Math.max(10, Math.min(140, base + Math.random() * 10 - 5));
                }
            },
            'GTA 6': {
                cpu: 'Intel Core i7-8700K / AMD Ryzen 7 3700X',
                ram: '16 GB',
                gpu: 'NVIDIA GeForce RTX 2080 / AMD Radeon RX 6800',
                storage: '150 GB',
                recommended: {
                    cpu: 'Intel Core i9-10900K / AMD Ryzen 9 5900X',
                    ram: '32 GB',
                    gpu: 'NVIDIA GeForce RTX 3080 / AMD Radeon RX 6900 XT',
                    storage: '200 GB'
                },
                fpsEstimate: (cpuScore, ram, gpuScore) => {
                    let base = 50;
                    if (cpuScore < 0.6) base -= 25;
                    if (ram < 16) base -= 20;
                    if (gpuScore < 0.6) base -= 25;
                    return Math.max(5, Math.min(100, base + Math.random() * 10 - 5));
                }
            }
        };

        // ============================================================
        //  AI LOGIC
        // ============================================================

        // --- Simple scoring based on user input keywords ---
        function parseUserSpecs(text) {
            const lower = text.toLowerCase();
            let cpuScore = 0.5;
            let ram = 8;
            let gpuScore = 0.5;

            // CPU scoring
            if (lower.includes('i9') || lower.includes('ryzen 9') || lower.includes('i9-')) cpuScore = 0.95;
            else if (lower.includes('i7') || lower.includes('ryzen 7') || lower.includes('i7-')) cpuScore = 0.8;
            else if (lower.includes('i5') || lower.includes('ryzen 5') || lower.includes('i5-')) cpuScore = 0.65;
            else if (lower.includes('i3') || lower.includes('ryzen 3') || lower.includes('i3-')) cpuScore = 0.45;
            else if (lower.includes('pentium') || lower.includes('athlon')) cpuScore = 0.2;

            // RAM
            const ramMatch = text.match(/(\d+)\s*(gb|گیگ)/i);
            if (ramMatch) ram = parseFloat(ramMatch[1]);

            // GPU scoring
            if (lower.includes('rtx 40') || lower.includes('rx 7000')) gpuScore = 0.95;
            else if (lower.includes('rtx 30') || lower.includes('rx 6000')) gpuScore = 0.85;
            else if (lower.includes('rtx 20') || lower.includes('rx 5000') || lower.includes('gtx 16')) gpuScore = 0.7;
            else if (lower.includes('gtx 10') || lower.includes('rx 400') || lower.includes('rx 500')) gpuScore = 0.55;
            else if (lower.includes('gtx 9') || lower.includes('r9')) gpuScore = 0.4;
            else if (lower.includes('hd graphics') || lower.includes('integrated')) gpuScore = 0.2;

            return { cpuScore, ram, gpuScore };
        }

        // --- Check game compatibility ---
        function checkGameCompatibility(gameName, userSpecs) {
            const reqs = GAME_REQS[gameName];
            if (!reqs) return null;

            const { cpuScore, ram, gpuScore } = userSpecs;

            const cpuOk = cpuScore >= 0.4;
            const ramOk = ram >= parseFloat(reqs.ram);
            const gpuOk = gpuScore >= 0.4;

            const canRun = cpuOk && ramOk && gpuOk;
            const fps = reqs.fpsEstimate(cpuScore, ram, gpuScore);

            let status = canRun ? '🟢 قابل اجرا' : '🔴 نیاز به ارتقا';
            let statusClass = canRun ? 'good' : 'bad';
            let details = [];

            if (!cpuOk) details.push('پردازنده ضعیف‌تر از حداقل است');
            if (!ramOk) details.push(`رم کمتر از ${reqs.ram} است`);
            if (!gpuOk) details.push('کارت گرافیک ضعیف‌تر از حداقل است');
            if (canRun && cpuScore < 0.6) details.push('پردازنده در حداقل‌هاست، ممکن است کندی داشته باشید');
            if (canRun && ram < parseFloat(reqs.ram) * 1.5) details.push('رم در حداقل‌هاست، بستن برنامه‌های دیگر توصیه می‌شود');

            return {
                game: gameName,
                status,
                statusClass,
                fps: Math.round(fps),
                details: details.length ? details : ['سیستم شما برای اجرای این بازی مناسب است ✅'],
                minReqs: reqs,
                userCpu: cpuScore,
                userRam: ram,
                userGpu: gpuScore
            };
        }

        // --- Generate AI response ---
        function generateAIResponse(message) {
            const lower = message.toLowerCase();
            let response = '';

            // Check if user is asking about a game
            const gameKeys = Object.keys(GAME_REQS);
            let detectedGame = null;
            for (const key of gameKeys) {
                if (lower.includes(key.toLowerCase())) {
                    detectedGame = key;
                    break;
                }
            }

            // Check if user is asking about system / can I run
            const isSystemQuestion = lower.includes('سیستم') || lower.includes('مشخصات') ||
                lower.includes('اجرا') || lower.includes('بدوم') || lower.includes('run') ||
                lower.includes('fps') || lower.includes('کارت گرافیک') || lower.includes('رم') ||
                lower.includes('cpu') || lower.includes('پردازنده') || lower.includes('gpu');

            if (detectedGame && isSystemQuestion) {
                // Extract user specs from message
                const specs = parseUserSpecs(message);
                const result = checkGameCompatibility(detectedGame, specs);
                if (result) {
                    return formatSystemResult(result);
                }
            }

            // General questions
            if (lower.includes('سلام') || lower.includes('hi') || lower.includes('hello')) {
                response = '👋 سلام! من Game-Z AI هستم. می‌توانم سیستم شما را برای بازی‌ها بررسی کنم، سرورهای برتر را معرفی کنم یا به سوالات گیمینگ شما پاسخ دهم.';
            } else if (lower.includes('بهترین سرور') || lower.includes('بهترین سرور ماینکرفت')) {
                response =
                    '🏆 بهترین سرور ماینکرفت ایران با توجه به نظرات کاربران، **DragonCraft** با امتیاز ۴.۸ و پینگ ۷۰ms است. همچنین **SkyWars IR** با امتیاز ۴.۷ گزینه عالی دیگری است.';
            } else if (lower.includes('بهترین سرور cs2') || lower.includes('بهترین سرور کانتر')) {
                response =
                    '🔫 بهترین سرور CS2 ایران **Persian CS2** با امتیاز ۴.۹ و پینگ ۶۰ms است. جامعه فعال و آنتی‌چیت قوی دارد.';
            } else if (lower.includes('gta 6') || lower.includes('gta6')) {
                response =
                    '🏎️ GTA 6 قرار است در **۱۹ اکتبر ۲۰۲۶** منتشر شود. برای اجرای آن به سیستم قوی با RTX 2080 یا بالاتر و ۱۶ گیگ رم نیاز دارید. می‌توانید سیستم خود را با من بررسی کنید!';
            } else if (lower.includes('راست') || lower.includes('rust')) {
                response =
                    '🛡️ Rust یک بازی سخت‌گیرانه است. حداقل نیازها: i7-3770، ۱۶ گیگ رم و GTX 980. اگر سیستم شما ضعیف‌تر است، تنظیمات گرافیکی را پایین بیاورید.';
            } else if (lower.includes('ماینکرفت') || lower.includes('minecraft')) {
                response =
                    '⛏️ ماینکرفت روی اکثر سیستم‌ها اجرا می‌شود. حداقل نیاز: Core i3، ۴ گیگ رم و Intel HD Graphics. برای اجرای روان با مودها، i5 و ۸ گیگ رم توصیه می‌شود.';
            } else if (lower.includes('cs2') || lower.includes('کانتر ۲')) {
                response =
                    '🔫 CS2 نیاز به سیستم نسبتاً قوی دارد: i5-2500K، ۸ گیگ رم و GTX 660. برای اجرای روان با کیفیت بالا، i7 و ۱۶ گیگ رم پیشنهاد می‌شود.';
            } else if (lower.includes('help') || lower.includes('راهنما') || lower.includes('کمک')) {
                response =
                    '🆘 من می‌توانم: \n✅ بررسی سیستم شما برای بازی‌ها \n✅ معرفی بهترین سرورها \n✅ پاسخ به سوالات گیمینگ \n✅ اطلاعات بازی‌ها و تاریخ انتشار \n\nسوال خود را بپرسید!';
            } else if (lower.includes('خداحافظ') || lower.includes('bye')) {
                response = '🙋 خداحافظ! هر وقت سوالی داشتی، من اینجام. موفق باشی! 🎮';
            } else {
                // Fallback: try to help
                response =
                    '🤔 من متوجه سوال شما شدم. اگر می‌خواهید سیستم خود را برای یک بازی بررسی کنید، مشخصات سیستم (CPU، رم، GPU) را بگویید و نام بازی را ذکر کنید. \n\nمثلاً: "سیستم من i5 و ۸ گیگ رم و GTX 1060 دارم، CS2 رو می‌تونم اجرا کنم؟"';
            }

            return response;
        }

        // --- Format system result as HTML ---
        function formatSystemResult(result) {
            const fpsColor = result.fps >= 60 ? '#22c55e' : result.fps >= 30 ? '#fbbf24' : '#ff4444';
            let detailsHtml = result.details.map(d => `• ${d}`).join('\n');

            return `
        <div class="sys-result">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-weight:900;font-size:1.1rem;">🎮 ${result.game}</span>
            <span style="font-weight:700;color:${result.statusClass === 'good' ? '#22c55e' : '#ff4444'};">
              ${result.status}
            </span>
          </div>
          <div class="row"><span class="label">پردازنده (CPU)</span><span class="value ${result.userCpu >= 0.6 ? 'good' : result.userCpu >= 0.4 ? 'warn' : 'bad'}">${Math.round(result.userCpu * 100)}%</span></div>
          <div class="row"><span class="label">رم (RAM)</span><span class="value ${result.userRam >= 16 ? 'good' : result.userRam >= 8 ? 'warn' : 'bad'}">${result.userRam} GB</span></div>
          <div class="row"><span class="label">کارت گرافیک (GPU)</span><span class="value ${result.userGpu >= 0.6 ? 'good' : result.userGpu >= 0.4 ? 'warn' : 'bad'}">${Math.round(result.userGpu * 100)}%</span></div>
          <div class="row"><span class="label">حداقل رم مورد نیاز</span><span class="value">${result.minReqs.ram}</span></div>
          <div class="fps-box">
            🚀 تخمین FPS: <span class="fps-num" style="color:${fpsColor};">${result.fps}</span> فریم بر ثانیه
          </div>
          <div style="margin-top:8px;font-size:0.8rem;color:#aaa;white-space:pre-line;">
            ${detailsHtml}
          </div>
        </div>
      `;
        }

        // ============================================================
        //  CHAT UI
        // ============================================================

        const messagesEl = document.getElementById('chatMessages');
        const inputEl = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        function addMessage(text, isUser = false, isHTML = false) {
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'msg-user' : 'msg-bot'}`;

            const header = document.createElement('div');
            header.className = 'msg-header';
            if (isUser) {
                header.innerHTML = `<i class="fas fa-user"></i> شما`;
            } else {
                header.innerHTML = `<i class="fas fa-robot"></i> Game-Z AI`;
            }
            div.appendChild(header);

            const body = document.createElement('div');
            if (isHTML) {
                body.innerHTML = text;
            } else {
                body.textContent = text;
                body.style.whiteSpace = 'pre-line';
            }
            div.appendChild(body);

            const time = document.createElement('div');
            time.className = 'msg-time';
            time.textContent = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
            div.appendChild(time);

            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addWelcome() {
            const welcome = `
        👋 به Game-Z AI خوش آمدید!
        من می‌توانم:
        ✅ <strong>سیستم شما</strong> را برای بازی‌ها بررسی کنم
        ✅ <strong>بهترین سرورها</strong> را معرفی کنم
        ✅ به سوالات گیمینگ شما پاسخ دهم

        💡 <strong>مثال:</strong> "سیستم من i5 و ۸ گیگ رم و GTX 1060 دارم، CS2 رو می‌تونم اجرا کنم؟"
      `;
            addMessage(welcome, false, true);
        }

        function showTyping(show) {
            typingIndicator.classList.toggle('show', show);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.disabled = true;
            sendBtn.disabled = true;

            // User message
            addMessage(text, true, false);

            // Show typing
            showTyping(true);

            // Simulate AI thinking
            await new Promise(r => setTimeout(r, 600 + Math.random() * 400));

            // Generate response
            const response = generateAIResponse(text);
            showTyping(false);

            // Check if response contains HTML (system result)
            const isHTML = response.includes('<div class="sys-result">');
            addMessage(response, false, isHTML);

            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function clearChat() {
            messagesEl.innerHTML = '';
            addWelcome();
        }

        function askChip(question) {
            inputEl.value = question;
            sendMessage();
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================

        addWelcome();

        console.log('🤖 Game-Z AI loaded successfully!');
        console.log('🎮 Available games:', Object.keys(GAME_REQS).join(', '));
    </script>
