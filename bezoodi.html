<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Z.ir - به زودی</title>
  <link rel="icon" href="./pictures/logo daiere.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 780px;
      padding: 55px 35px;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 31, 31, 0.15);
      border-radius: 44px;
      box-shadow: 0 8px 80px rgba(255, 0, 60, 0.08);
      animation: fadeIn 1.1s ease-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.92) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo {
      width: 250px;
      max-width: 80%;
      margin-bottom: 28px;
      animation: floatLogo 4s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(255, 0, 80, 0.3));
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-16px) scale(1.02); }
    }

    h1 {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff1f3d, #b000ff, #ff6a00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      text-shadow: 0 0 60px rgba(255, 0, 60, 0.15);
      letter-spacing: 2px;
    }

    .sub-text {
      font-size: 1.15rem;
      color: #ccc;
      line-height: 2;
      margin-bottom: 32px;
      max-width: 580px;
      margin-left: auto;
      margin-right: auto;
    }

    .countdown {
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 38px;
      background: rgba(0, 0, 0, 0.4);
      padding: 22px 35px;
      border-radius: 60px;
      border: 1px solid rgba(255, 31, 61, 0.2);
      box-shadow: 0 4px 50px rgba(255, 0, 60, 0.08);
      font-family: 'Orbitron', monospace;
      letter-spacing: 4px;
      display: inline-block;
    }

    .countdown span {
      background: linear-gradient(135deg, #ff1f3d, #b000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-group {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .home-btn {
      display: inline-block;
      padding: 18px 44px;
      background: linear-gradient(135deg, #ff1f3d, #b000ff);
      color: white;
      text-decoration: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 4px 35px rgba(255, 0, 60, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .home-btn:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 8px 55px rgba(255, 0, 80, 0.4), 0 0 100px rgba(150, 0, 255, 0.1);
    }

    .home-btn i {
      margin-left: 10px;
    }

    .social-icons {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 22px;
    }

    .social-icons a {
      color: #666;
      font-size: 1.7rem;
      transition: 0.3s;
    }

    .social-icons a:hover {
      color: #ff4f4f;
      transform: scale(1.2) translateY(-3px);
    }

    @media (max-width: 600px) {
      .container { padding: 32px 20px; }
      h1 { font-size: 2.6rem; }
      .countdown { font-size: 2rem; padding: 16px 24px; letter-spacing: 2px; }
      .logo { width: 170px; }
      .sub-text { font-size: 1rem; }
    }
    @media (max-width: 400px) {
      h1 { font-size: 2rem; }
      .countdown { font-size: 1.6rem; padding: 12px 16px; }
      .home-btn { padding: 14px 28px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div class="container">
    <img src="./pictures/logo daiere.png" class="logo" alt="Game-Z Logo">

    <h1>به زودی</h1>

    <p class="sub-text">
      Game-Z.ir در حال آماده‌سازی جدیدترین اخبار بازی‌ها،
      لیست سرورها، بررسی‌ها و به‌روزرسانی‌هاست.<br>
      با ما همراه باشید!
    </p>

    <div class="countdown" id="countdown">
      <span id="days">00</span>d
      <span id="hours">00</span>h
      <span id="minutes">00</span>m
      <span id="seconds">00</span>s
    </div>

    <div class="btn-group">
      <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i> بازگشت به خانه
      </a>
    </div>

    <div class="social-icons">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-discord"></i></a>
    </div>
  </div>

  <script>
    const launchDate = new Date("July 29, 2026 22:30:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = Math.max(0, launchDate - now);

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const COUNT = 70;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2.6 + 0.6;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = `hsla(${Math.random() * 60 + 320}, 80%, 60%, ${this.opacity})`;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w) this.speedX *= -1;
          if (this.y < 0 || this.y > h) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = 'rgba(255, 50, 100, 0.4)';
          ctx.shadowBlur = 16;
          ctx.fill();
        }
      }

      for (let i = 0; i < COUNT; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(200, 80, 255, ${0.08 * (1 - dist/140)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
