<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Z.ir - به زودی</title>
  <link rel="icon" href="./logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .soon-container {
      position: relative;
      z-index: 2;
      max-width: 780px;
      padding: 55px 35px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 255, 159, 0.06);
      border-radius: 44px;
      box-shadow: 0 8px 80px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 1.1s ease-out;
      margin: 120px auto 40px;
      text-align: center;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: scale(0.92) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .soon-container .logo {
      width: 250px;
      max-width: 80%;
      margin-bottom: 28px;
      animation: floatLogo 4s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(0, 255, 159, 0.15));
    }
    .soon-container h1 {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      text-shadow: 0 0 60px rgba(0, 255, 159, 0.08);
      letter-spacing: 2px;
    }
    .soon-container .sub-text {
      font-size: 1.15rem;
      color: var(--text-secondary);
      line-height: 2;
      margin-bottom: 32px;
      max-width: 580px;
      margin-left: auto;
      margin-right: auto;
    }
    .soon-container .countdown {
      font-size: 3rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 38px;
      background: rgba(0,0,0,0.3);
      padding: 22px 35px;
      border-radius: 60px;
      border: 1px solid rgba(0, 255, 159, 0.06);
      box-shadow: 0 4px 50px rgba(0, 0, 0, 0.1);
      font-family: 'Orbitron', monospace;
      letter-spacing: 4px;
      display: inline-block;
    }
    .soon-container .countdown span {
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .social-icons {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 22px;
    }
    .social-icons a {
      color: var(--text-secondary);
      font-size: 1.7rem;
      transition: 0.3s;
    }
    .social-icons a:hover {
      color: var(--neon-green);
      transform: scale(1.2) translateY(-3px);
    }
    @media (max-width: 600px) {
      .soon-container { padding: 32px 20px; margin: 100px 16px 30px; }
      .soon-container h1 { font-size: 2.6rem; }
      .soon-container .countdown { font-size: 2rem; padding: 16px 24px; letter-spacing: 2px; }
      .soon-container .logo { width: 170px; }
      .soon-container .sub-text { font-size: 1rem; }
    }
    @media (max-width: 400px) {
      .soon-container h1 { font-size: 2rem; }
      .soon-container .countdown { font-size: 1.6rem; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <header id="mainHeader">
    <img src="./logo.png" alt="Game-Z" class="logo" />
    <div class="header-controls">
      <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم">🌙</button>
    </div>
    <nav id="mainNav">
      <a href="index.html"><i class="fas fa-home"></i> خانه</a>
      <a href="maincraft.html"><i class="fas fa-cube"></i> ماینکرفت</a>
      <a href="cs2.html"><i class="fas fa-crosshairs"></i> CS2</a>
      <a href="cs16.html"><i class="fas fa-bolt"></i> CS 1.6</a>
      <a href="rust.html"><i class="fas fa-shield"></i> Rust</a>
    </nav>
  </header>

  <div class="soon-container">
    <img src="./logo.png" class="logo" alt="Game-Z Logo">

    <h1>به زودی</h1>

    <p class="sub-text">
      Game-Z.ir در حال آماده‌سازی جدیدترین اخبار بازی‌ها،
      لیست سرورها، بررسی‌ها و به‌روزرسانی‌هاست.<br>
      با ما همراه باشید!
    </p>

    <div class="countdown" id="countdown">
      <span id="days">00</span>d
      <span id="hours">00</span>h
      <span id="minutes">00</span>m
      <span id="seconds">00</span>s
    </div>

    <div class="btn-group">
      <a href="index.html" class="btn-neon primary">
        <i class="fas fa-home"></i> بازگشت به خانه
      </a>
    </div>

    <div class="social-icons">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-discord"></i></a>
    </div>
  </div>

  <script>
    const launchDate = new Date("July 29, 2026 22:30:00").getTime();
    function updateCountdown() {
      const now = new Date().getTime();
      const distance = Math.max(0, launchDate - now);
      document.getElementById('days').textContent = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
      document.getElementById('hours').textContent = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
      document.getElementById('seconds').textContent = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

  <script src="ui.js"></script>

  <script type="module" src="script.js"></script>
</body>
</html>
