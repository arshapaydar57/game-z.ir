<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game-Z.ir - Coming Soon</title>

<link rel="icon" href="./pictures/logo.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Vazirmatn',sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    overflow:hidden;
}

.container{
    max-width:700px;
    padding:20px;
}

.logo{
    width:280px;
    margin-bottom:30px;
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:4rem;
    color:#ff1f3d;
    margin-bottom:15px;
}

p{
    font-size:1.2rem;
    color:#ccc;
    margin-bottom:30px;
    line-height:2;
}

.countdown{
    font-size:2rem;
    font-weight:bold;
    color:white;
    margin-bottom:35px;
}

.home-btn{
    display:inline-block;
    padding:15px 35px;
    background:#ff1f3d;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,31,61,.35);
}

.home-btn:hover{
    background:#d9002b;
    transform:translateY(-4px);
    box-shadow:0 0 30px rgba(255,31,61,.6);
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#ff1f3d;
    filter:blur(200px);
    opacity:.15;
    border-radius:50%;
    z-index:-1;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

</style>

</head>

<body>

<div class="glow"></div>

<div class="container">

    <img src="./pictures/logo.png" class="logo" alt="Game-Z Logo">

    <h1>COMING SOON</h1>

    <p>
        Game-Z.ir is preparing the latest gaming news,
        server lists, reviews and updates.<br>
        Stay tuned!
    </p>

    <div class="countdown" id="countdown"></div>

    <a href="index.html" class="home-btn">
        🏠 بازگشت به خانه
    </a>

</div>

<script>

const launchDate = new Date("July 29, 2026 22:30:00").getTime();

setInterval(function(){

const now = new Date().getTime();

const distance = launchDate - now;

const days = Math.floor(distance/(1000*60*60*24));

const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

const minutes = Math.floor((distance%(1000*60*60))/(1000*60));

const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown").innerHTML =
days + "d " +
hours + "h " +
minutes + "m " +
seconds + "s";

},1000);

</script>

</body>
</html>
