<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Z | بازی حدس عدد</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="shortcut icon" href="./pictures/logo daiere.png" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

    body { background: #0a0a0a; color: #fff; min-height: 100vh; overflow-x: hidden; }

    #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    header {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 31, 31, 0.15); padding: 14px 8%;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
    }
    header.shrink { padding: 8px 8%; background: rgba(0, 0, 0, 0.95); }
    .logo { height: 50px; transition: 0.3s; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.3)); }
    header.shrink .logo { height: 38px; }

    nav a {
      color: #f0f0f0; text-decoration: none; margin: 0 14px; font-weight: 600; font-size: 1rem;
      transition: 0.3s; position: relative; padding: 4px 0;
    }
    nav a::after {
      content: ''; position: absolute; bottom: -2px; right: 0;
      width: 0; height: 2.5px; background: linear-gradient(90deg, #ff1f1f, #b000ff);
      transition: 0.3s ease; border-radius: 2px;
    }
    nav a:hover { color: #ff4f4f; }
    nav a:hover::after { width: 100%; }

    .hero {
      position: relative; z-index: 2; min-height: 30vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      padding: 130px 20px 30px;
      background: linear-gradient(145deg, rgba(20, 0, 30, 0.6), rgba(0, 0, 0, 0.85));
    }
    .hero h1 {
      font-size: 3rem; font-weight: 900;
      background: linear-gradient(135deg, #ff3b3b, #c000ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-shadow: 0 0 40px rgba(255, 0, 100, 0.15);
      letter-spacing: -0.5px;
    }
    .hero p { color: #ccc; margin-top: 8px; font-size: 1.1rem; }

    .game-wrapper {
      position: relative; z-index: 2; max-width: 620px;
      margin: 20px auto 60px; padding: 45px 35px;
      background: rgba(10, 10, 20, 0.5); backdrop-filter: blur(8px);
      border-radius: 32px; border: 1px solid rgba(255, 31, 31, 0.12);
      box-shadow: 0 8px 60px rgba(255, 0, 60, 0.04);
    }

    .guess-stats {
      display: flex; justify-content: center; gap: 35px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .guess-stats .stat {
      background: rgba(0,0,0,0.4); padding: 8px 24px; border-radius: 40px;
      border: 1px solid #2a1a2a; color: #ccc; font-size: 0.9rem;
    }
    .guess-stats .stat span {
      color: #ff4f4f; font-weight: 900; font-size: 1.2rem;
    }

    .number-display {
      text-align: center; font-size: 4.8rem; font-weight: 900;
      color: #fff; text-shadow: 0 0 50px rgba(255, 0, 100, 0.15);
      margin: 10px 0 14px; min-height: 90px;
    }
    .number-display .hint-msg {
      font-size: 1.2rem; color: #ffaa44; display: block; margin-top: 6px;
    }

    .range-indicator {
      display: flex; justify-content: space-between; padding: 0 12px;
      color: #888; font-weight: 700; font-size: 1rem; margin-bottom: 10px;
    }
    .range-indicator .min { color: #4caf50; }
    .range-indicator .max { color: #ff6a6a; }

    .progress-bar {
      width: 100%; height: 8px; background: #1a1a2e; border-radius: 10px;
      margin-bottom: 22px; overflow: hidden; border: 1px solid #2a1a2a;
    }
    .progress-bar .fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ff1f1f, #b000ff);
      border-radius: 10px; transition: width 0.5s ease;
    }

    .guess-input-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .guess-input-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }

    #guess-input {
      width: 110px; padding: 16px 12px; border-radius: 60px;
      border: 2px solid #2a1a2a; background: rgba(10, 10, 20, 0.8);
      color: #fff; font-size: 1.6rem; text-align: center; outline: none;
      transition: 0.3s; font-weight: 700;
    }
    #guess-input:focus { border-color: #ff1f1f; box-shadow: 0 0 40px rgba(255, 0, 80, 0.1); }
    #guess-input:disabled { opacity: 0.4; }

    .guess-btn {
      background: linear-gradient(135deg, #ff1f1f, #b000ff); border: none; color: #fff;
      padding: 16px 34px; border-radius: 60px; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: 0.3s; box-shadow: 0 4px 30px rgba(255, 0, 60, 0.15);
    }
    .guess-btn:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 8px 45px rgba(255, 0, 80, 0.25);
    }
    .guess-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    .reset-btn {
      background: linear-gradient(135deg, #444, #222) !important; padding: 16px 24px !important;
      box-shadow: none !important;
    }
    .reset-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #666, #333) !important;
      box-shadow: 0 4px 35px rgba(255,255,255,0.05) !important;
    }

    .guess-history {
      margin-top: 20px; background: rgba(0,0,0,0.3); border-radius: 22px;
      padding: 14px 20px; border: 1px solid #1a1a2a; min-height: 50px;
      max-height: 85px; overflow-y: auto; width: 100%;
    }
    .guess-history .history-item {
      display: inline-block; background: #1a1a2e; padding: 4px 16px;
      border-radius: 20px; margin: 3px 5px; font-weight: 700; font-size: 0.85rem;
      border: 1px solid #2a2a4a;
    }
    .history-item.low { border-color: #4caf50; color: #4caf50; }
    .history-item.high { border-color: #ff6a6a; color: #ff6a6a; }
    .history-item.win { border-color: #ffd700; color: #ffd700; background: #2a2a0a; }

    #game-message {
      min-height: 30px; color: #ff6a6a; font-weight: 700; margin-top: 6px; font-size: 0.95rem; text-align: center;
    }

    footer {
      position: relative; z-index: 2; text-align: center;
      padding: 35px 20px 28px; border-top: 1px solid #1a0a1a;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px);
      color: #777; font-size: 0.9rem; display: flex; flex-direction: column; gap: 6px;
    }
    footer .footer-icons { display: flex; justify-content: center; gap: 22px; margin-top: 10px; }
    footer .footer-icons a { color: #888; font-size: 1.4rem; transition: 0.3s; }
    footer .footer-icons a:hover { color: #ff4f4f; transform: scale(1.15) translateY(-3px); }

    @media (max-width: 550px) {
      .game-wrapper { padding: 28px 18px; margin: 10px 14px 40px; }
      .guess-stats { gap: 18px; }
      .guess-stats .stat { font-size: 0.8rem; padding: 5px 14px; }
      .number-display { font-size: 3.2rem; min-height: 70px; }
      #guess-input { width: 85px; font-size: 1.3rem; padding: 12px; }
      .guess-btn { padding: 12px 22px; font-size: 0.85rem; }
      .reset-btn { padding: 12px 18px !important; }
      .hero h1 { font-size: 2.2rem; }
      header { padding: 12px 5%; flex-wrap: wrap; }
      .logo { height: 42px; }
      nav a { margin: 0 8px; font-size: 0.85rem; }
    }
    @media (max-width: 400px) {
      .number-display { font-size: 2.6rem; }
      #guess-input { width: 70px; font-size: 1.1rem; }
      .guess-btn { padding: 10px 18px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <header id="mainHeader">
    <img src="./pictures/logo daiere.png" alt="Game-Z Logo" class="logo" />
    <nav>
      <a href="index.html#home"><i class="fas fa-home"></i> خانه</a>
      <a href="./gta6.html"><i class="fas fa-clock"></i> روز شمار GTA 6</a>
      <a href="index.html#contact"><i class="fas fa-envelope"></i> تماس</a>
    </nav>
  </header>

  <section class="hero">
    <h1>🎯 حدس عدد</h1>
    <p>یه عدد بین ۱ تا ۱۰۰ رو در کمتر از ۱۰ تلاش پیدا کن!</p>
  </section>

  <div class="game-wrapper">
    <div class="guess-stats">
      <div class="stat">🎯 تلاش: <span id="attempts">0</span></div>
      <div class="stat">🏆 بهترین: <span id="best-score">--</span></div>
    </div>

    <div class="number-display">
      <span id="main-number">❓</span>
      <span class="hint-msg" id="hint-text">عدد رو حدس بزن</span>
    </div>

    <div class="range-indicator">
      <span class="min" id="range-min">۱</span>
      <span>🔽</span>
      <span class="max" id="range-max">۱۰۰</span>
    </div>

    <div class="progress-bar">
      <div class="fill" id="progress-fill"></div>
    </div>

    <div class="guess-input-area">
      <div class="guess-input-row">
        <input type="number" id="guess-input" min="1" max="100" placeholder="??" autocomplete="off" />
        <button class="guess-btn" id="guess-btn">حدس!</button>
        <button class="guess-btn reset-btn" id="reset-btn">🔄 دوباره</button>
      </div>
      <div id="game-message"></div>
    </div>

    <div class="guess-history" id="history-box">
      <span style="color:#666; font-size:0.8rem;">📋 تاریخچه حدس‌ها</span>
      <div id="history-list"></div>
    </div>
  </div>

  <footer>
    <div>© 2026 GAME-Z.IR - All Rights Reserved</div>
    <div>Made by Arsha_pm</div>
    <div class="footer-icons">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-discord"></i></a>
    </div>
  </footer>

  <script>
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      const particles = [];
      const COUNT = 80;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 2.8 + 0.6;
          this.speedX = (Math.random() - 0.5) * 0.5;
          this.speedY = (Math.random() - 0.5) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.color = `hsla(${Math.random() * 60 + 320}, 80%, 60%, ${this.opacity})`;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w) this.speedX *= -1;
          if (this.y < 0 || this.y > h) this.speedY *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = 'rgba(255, 50, 100, 0.4)';
          ctx.shadowBlur = 16;
          ctx.fill();
        }
      }
      for (let i = 0; i < COUNT; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(200, 80, 255, ${0.08 * (1 - dist/150)})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    const header = document.getElementById('mainHeader');
    window.addEventListener('scroll', () => {
      header.classList.toggle('shrink', window.scrollY > 80);
    });

    (function() {
      const MIN = 1, MAX = 100, MAX_ATTEMPTS = 10;
      let targetNumber = 0, attempts = 0, gameOver = false, history = [];
      let bestScore = localStorage.getItem('gameBestScore') || null;

      const mainNumber = document.getElementById('main-number');
      const hintText = document.getElementById('hint-text');
      const rangeMin = document.getElementById('range-min');
      const rangeMax = document.getElementById('range-max');
      const progressFill = document.getElementById('progress-fill');
      const attemptsDisplay = document.getElementById('attempts');
      const bestScoreDisplay = document.getElementById('best-score');
      const guessInput = document.getElementById('guess-input');
      const guessBtn = document.getElementById('guess-btn');
      const resetBtn = document.getElementById('reset-btn');
      const messageEl = document.getElementById('game-message');
      const historyList = document.getElementById('history-list');

      function updateBestDisplay() {
        bestScoreDisplay.textContent = bestScore !== null ? bestScore : '--';
      }
      updateBestDisplay();

      function resetGame() {
        targetNumber = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
        attempts = 0; gameOver = false; history = [];
        guessInput.value = ''; guessInput.disabled = false; guessBtn.disabled = false;
        messageEl.textContent = ''; messageEl.style.color = '#ff6a6a';
        mainNumber.textContent = '❓'; hintText.textContent = 'عدد رو حدس بزن';
        rangeMin.textContent = MIN; rangeMax.textContent = MAX;
        progressFill.style.width = '0%'; attemptsDisplay.textContent = '0';
        historyList.innerHTML = ''; guessInput.focus();
      }

      function saveBestScore(score) {
        if (bestScore === null || score < bestScore) {
          bestScore = score;
          localStorage.setItem('gameBestScore', score);
          updateBestDisplay();
        }
      }

      function submitGuess() {
        if (gameOver) {
          messageEl.textContent = '⚠️ بازی تموم شده! دکمه "دوباره" رو بزن.';
          return;
        }
        const raw = guessInput.value.trim();
        if (raw === '') { messageEl.textContent = '❌ لطفاً یه عدد وارد کن!'; return; }
        const guess = Number(raw);
        if (isNaN(guess) || !Number.isInteger(guess) || guess < MIN || guess > MAX) {
          messageEl.textContent = `❌ عدد بین ${MIN} تا ${MAX} وارد کن!`;
          guessInput.value = ''; return;
        }
        messageEl.textContent = '';
        attempts++; attemptsDisplay.textContent = attempts;
        const progress = Math.min((attempts / MAX_ATTEMPTS) * 100, 100);
        progressFill.style.width = progress + '%';

        let historyClass = '', historyLabel = '';

        if (guess === targetNumber) {
          mainNumber.textContent = `🎉 ${targetNumber}`;
          hintText.textContent = '🔥 درست حدس زدی!';
          gameOver = true; guessInput.disabled = true; guessBtn.disabled = true;
          messageEl.textContent = `🎊 آفرین! تو ${attempts} تلاش پیدا کردی!`;
          messageEl.style.color = '#4caf50';
          historyClass = 'win'; historyLabel = `✅ ${guess}`;
          saveBestScore(attempts);
          mainNumber.style.transform = 'scale(1.3)';
          setTimeout(() => mainNumber.style.transform = 'scale(1)', 500);
        } else {
          if (guess < targetNumber) {
            hintText.textContent = `📈 برو بالاتر (${guess} کوچیک‌تره)`;
            rangeMin.textContent = Math.max(Number(rangeMin.textContent), guess + 1);
            historyClass = 'low'; historyLabel = `⬆ ${guess}`;
          } else {
            hintText.textContent = `📉 بیا پایین‌تر (${guess} بزرگ‌تره)`;
            rangeMax.textContent = Math.min(Number(rangeMax.textContent), guess - 1);
            historyClass = 'high'; historyLabel = `⬇ ${guess}`;
          }
          history.push({ value: guess, class: historyClass, label: historyLabel });
        }

        const historyItem = document.createElement('span');
        historyItem.className = `history-item ${historyClass}`;
        historyItem.textContent = historyLabel;
        historyList.appendChild(historyItem);
        historyList.scrollTop = historyList.scrollHeight;

        if (!gameOver && attempts >= MAX_ATTEMPTS) {
          gameOver = true; guessInput.disabled = true; guessBtn.disabled = true;
          mainNumber.textContent = `😢 ${targetNumber}`;
          hintText.textContent = '💔 تلاش‌ها تموم شد...';
          messageEl.textContent = `😞 متاسف! عدد ${targetNumber} بود. دوباره امتحان کن!`;
          messageEl.style.color = '#ff6a6a';
        }
        guessInput.value = ''; guessInput.focus();
      }

      guessBtn.addEventListener('click', submitGuess);
      resetBtn.addEventListener('click', resetGame);
      guessInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
      });
      resetGame();
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
