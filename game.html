<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-Z | بازی حدس عدد</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <style>
    .game-wrapper {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 120px auto 60px;
      padding: 45px 35px;
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      border: 1px solid rgba(0, 255, 159, 0.06);
      box-shadow: 0 8px 60px rgba(0, 0, 0, 0.4);
    }
    .guess-stats {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .guess-stats .stat {
      background: rgba(0,0,0,0.3);
      padding: 8px 24px;
      border-radius: 40px;
      border: 1px solid rgba(0, 255, 159, 0.04);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .guess-stats .stat span {
      color: var(--neon-green);
      font-weight: 900;
      font-size: 1.2rem;
    }
    .number-display {
      text-align: center;
      font-size: 4.8rem;
      font-weight: 900;
      color: var(--text-primary);
      text-shadow: 0 0 50px rgba(0, 255, 159, 0.08);
      margin: 10px 0 14px;
      min-height: 90px;
    }
    .number-display .hint-msg {
      font-size: 1.2rem;
      color: #ffaa44;
      display: block;
      margin-top: 6px;
    }
    .range-indicator {
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .range-indicator .min { color: var(--neon-green); }
    .range-indicator .max { color: #ff6a6a; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      margin-bottom: 22px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 159, 0.04);
    }
    .progress-bar .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      border-radius: 10px;
      transition: width 0.5s ease;
    }
    .guess-input-area { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .guess-input-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    #guess-input {
      width: 110px;
      padding: 16px 12px;
      border-radius: 60px;
      border: 2px solid rgba(0, 255, 159, 0.06);
      background: rgba(0,0,0,0.4);
      color: var(--text-primary);
      font-size: 1.6rem;
      text-align: center;
      outline: none;
      transition: 0.3s;
      font-weight: 700;
    }
    #guess-input:focus { border-color: var(--neon-green); box-shadow: 0 0 40px rgba(0, 255, 159, 0.05); }
    #guess-input:disabled { opacity: 0.4; }
    .guess-btn {
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      color: #0a0a0f;
      border: none;
      padding: 16px 34px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 30px rgba(0, 255, 159, 0.1);
    }
    .guess-btn:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 8px 45px rgba(0, 255, 159, 0.2);
    }
    .guess-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .reset-btn {
      background: rgba(255,255,255,0.04) !important;
      color: var(--text-primary) !important;
      box-shadow: none !important;
    }
    .reset-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.08) !important;
    }
    .guess-history {
      margin-top: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 22px;
      padding: 14px 20px;
      border: 1px solid rgba(0, 255, 159, 0.03);
      min-height: 50px;
      max-height: 85px;
      overflow-y: auto;
      width: 100%;
    }
    .guess-history .history-item {
      display: inline-block;
      background: rgba(0,0,0,0.3);
      padding: 4px 16px;
      border-radius: 20px;
      margin: 3px 5px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(0, 255, 159, 0.04);
    }
    .history-item.low { border-color: var(--neon-green); color: var(--neon-green); }
    .history-item.high { border-color: #ff6a6a; color: #ff6a6a; }
    .history-item.win { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.05); }
    #game-message {
      min-height: 30px;
      color: #ff6a6a;
      font-weight: 700;
      margin-top: 6px;
      font-size: 0.95rem;
      text-align: center;
    }
    @media (max-width: 550px) {
      .game-wrapper { padding: 28px 18px; margin: 100px 14px 40px; }
      .guess-stats { gap: 18px; }
      .guess-stats .stat { font-size: 0.8rem; padding: 5px 14px; }
      .number-display { font-size: 3.2rem; min-height: 70px; }
      #guess-input { width: 85px; font-size: 1.3rem; padding: 12px; }
      .guess-btn { padding: 12px 22px; font-size: 0.85rem; }
      .reset-btn { padding: 12px 18px !important; }
    }
    @media (max-width: 400px) {
      .number-display { font-size: 2.6rem; }
      #guess-input { width: 70px; font-size: 1.1rem; }
      .guess-btn { padding: 10px 18px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <header id="mainHeader">
    <img src="./logo.png" alt="Game-Z Logo" class="logo" />
    <div class="header-controls">
      <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم">🌙</button>
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    </div>
    <nav id="mainNav">
      <a href="index.html#home"><i class="fas fa-home"></i> خانه</a>
      <a href="./gta6.html"><i class="fas fa-clock"></i> روز شمار GTA 6</a>
      <a href="index.html#contact"><i class="fas fa-envelope"></i> تماس</a>
    </nav>
  </header>

  <div class="game-wrapper">
    <div class="guess-stats">
      <div class="stat">🎯 تلاش: <span id="attempts">0</span></div>
      <div class="stat">🏆 بهترین: <span id="best-score">--</span></div>
    </div>

    <div class="number-display">
      <span id="main-number">❓</span>
      <span class="hint-msg" id="hint-text">عدد رو حدس بزن</span>
    </div>

    <div class="range-indicator">
      <span class="min" id="range-min">۱</span>
      <span>🔽</span>
      <span class="max" id="range-max">۱۰۰</span>
    </div>

    <div class="progress-bar">
      <div class="fill" id="progress-fill"></div>
    </div>

    <div class="guess-input-area">
      <div class="guess-input-row">
        <input type="number" id="guess-input" min="1" max="100" placeholder="??" autocomplete="off" />
        <button class="guess-btn" id="guess-btn">حدس!</button>
        <button class="guess-btn reset-btn" id="reset-btn">🔄 دوباره</button>
      </div>
      <div id="game-message"></div>
    </div>

    <div class="guess-history" id="history-box">
      <span style="color:var(--text-secondary); font-size:0.8rem;">📋 تاریخچه حدس‌ها</span>
      <div id="history-list"></div>
    </div>
  </div>

  <footer>
    <div>© 2026 GAME-Z.IR - All Rights Reserved</div>
    <div>Made by Arsha_pm</div>
    <div class="footer-icons">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-discord"></i></a>
    </div>
  </footer>

  <script src="ui.js"></script>

  <script type="module" src="script.js"></script>
</body>
</html>
