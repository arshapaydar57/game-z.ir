<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GAME-Z | GTA VI Coming Soon</title>
  <meta name="description" content="روزشمار انتشار بازی GTA 6"/>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="shortcut icon" href="./logo.png" type="image/x-icon"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .gta-container {
      position: relative;
      z-index: 2;
      width: min(920px, 92%);
      padding: 50px 40px;
      border-radius: 44px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 255, 159, 0.06);
      box-shadow: 0 8px 80px rgba(0, 255, 159, 0.04);
      text-align: center;
      color: var(--text-primary);
      animation: fadeInUp 1.1s ease-out;
      margin: 120px auto 40px;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(50px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .gta-container .logo {
      width: 220px;
      max-width: 70%;
      margin-bottom: 18px;
      animation: floatLogo 4.5s ease-in-out infinite;
      filter: drop-shadow(0 0 40px rgba(0, 255, 159, 0.15));
    }
    .gta-container h1 {
      font: 900 60px 'Orbitron', sans-serif;
      letter-spacing: 5px;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .gta-container .sub {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      letter-spacing: 1px;
    }
    .gta-container .timer {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .gta-container .box {
      width: 125px;
      padding: 20px 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 159, 0.06);
      border-radius: 24px;
      transition: 0.4s;
    }
    .gta-container .box:hover {
      border-color: var(--neon-green);
      box-shadow: 0 4px 40px rgba(0, 255, 159, 0.06);
      transform: translateY(-4px);
    }
    .gta-container .num {
      font: 700 42px 'Orbitron', monospace;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gta-container .lbl {
      color: var(--text-secondary);
      font-size: 0.7rem;
      letter-spacing: 2px;
      margin-top: 6px;
      text-transform: uppercase;
    }
    @media (max-width: 600px) {
      .gta-container { padding: 30px 20px; margin: 100px 16px 30px; }
      .gta-container h1 { font-size: 32px; letter-spacing: 3px; }
      .gta-container .num { font-size: 30px; }
      .gta-container .box { width: 78px; padding: 14px 8px; }
      .gta-container .logo { width: 150px; }
    }
    @media (max-width: 400px) {
      .gta-container .box { width: 65px; }
      .gta-container .num { font-size: 24px; }
      .gta-container h1 { font-size: 26px; }
      .gta-container .timer { gap: 10px; }
    }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <header id="mainHeader">
    <img src="./logo.png" alt="Game-Z" class="logo" />
    <div class="header-controls">
      <button class="theme-toggle" id="themeToggle" aria-label="تغییر تم">🌙</button>
    </div>
    <nav id="mainNav">
      <a href="index.html"><i class="fas fa-home"></i> خانه</a>
      <a href="maincraft.html"><i class="fas fa-cube"></i> ماینکرفت</a>
      <a href="cs2.html"><i class="fas fa-crosshairs"></i> CS2</a>
      <a href="cs16.html"><i class="fas fa-bolt"></i> CS 1.6</a>
      <a href="rust.html"><i class="fas fa-shield"></i> Rust</a>
    </nav>
  </header>

  <div class="gta-container">
    <img src="./pictures/gta6 logo.png" class="logo" alt="GTA VI Logo" />
    <h1>COMING SOON</h1>
    <div class="sub">🎮 The next level of GTA is almost here.</div>
    <div class="timer">
      <div class="box"><div class="num" id="days">0</div><div class="lbl">DAY</div></div>
      <div class="box"><div class="num" id="hours">0</div><div class="lbl">HOUR</div></div>
      <div class="box"><div class="num" id="minutes">0</div><div class="lbl">MIN</div></div>
      <div class="box"><div class="num" id="seconds">0</div><div class="lbl">SEC</div></div>
    </div>
    <a href="index.html" class="btn-neon primary"><i class="fas fa-home"></i> بازگشت به خانه</a>
  </div>

  <script>
    const target = new Date("2026-10-19T22:30:00").getTime();
    function updateTimer() {
      const diff = Math.max(0, target - Date.now());
      document.getElementById('days').textContent = Math.floor(diff / 86400000);
      document.getElementById('hours').textContent = Math.floor((diff % 86400000) / 3600000);
      document.getElementById('minutes').textContent = Math.floor((diff % 3600000) / 60000);
      document.getElementById('seconds').textContent = Math.floor((diff % 60000) / 1000);
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

  <script src="ui.js"></script>

  <script type="module" src="script.js"></script>
</body>
</html>
