<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME-Z | GTA VI Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="shotcut icon" href="./pictures/logo.png" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Vazirmatn,sans-serif;height:100vh;overflow:hidden;background:linear-gradient(#32104d 0%,#8a2d88 45%,#ff8a4d 100%);display:flex;align-items:center;justify-content:center}
.sky,.grid,.sun,.palms,.particles{position:absolute;inset:0}
.sun{inset:auto;top:7%;left:50%;transform:translateX(-50%);width:320px;height:320px;border-radius:50%;background:linear-gradient(#ffe07a,#ff6f91);box-shadow:0 0 120px #ff8f66}
.grid{background:repeating-linear-gradient(transparent 0 34px,#ff8fc522 35px),linear-gradient(to top,#000 0,#0000 35%);transform:perspective(500px) rotateX(75deg);transform-origin:bottom;height:45%;top:auto;bottom:-5%}
.palms:before,.palms:after{content:"🌴";position:absolute;bottom:15px;font-size:120px;filter:brightness(.1)}
.palms:before{left:5%}.palms:after{right:5%}
.card{position:relative;z-index:2;width:min(900px,92%);padding:45px;border-radius:28px;background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(18px);text-align:center;color:#fff;box-shadow:0 0 60px #0006}
.logo{width:220px;margin-bottom:20px;animation:f 4s ease-in-out infinite}
h1{font:900 70px Orbitron,sans-serif;letter-spacing:4px;text-shadow:0 0 25px #ff5da8}
.sub{margin:15px 0 35px;color:#ffe8f4}
.timer{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.box{width:130px;padding:18px;background:#0008;border:1px solid #ffffff33;border-radius:18px;box-shadow:0 0 20px #ff60b066}
.num{font:700 46px Orbitron}.lbl{color:#ffd8ef}
a{display:inline-block;margin-top:35px;padding:16px 38px;border-radius:14px;background:linear-gradient(90deg,#ff4aa2,#ff9349);color:#fff;text-decoration:none;font-weight:700;transition:.3s}a:hover{transform:scale(1.05);box-shadow:0 0 25px #ff7aa7}
@keyframes f{50%{transform:translateY(-10px)}}
</style></head><body>
<div class="sky"></div><div class="sun"></div><div class="grid"></div><div class="palms"></div>
<div class="card">
<img src="./pictures/logo daiere.png" class="logo">
<h1>COMING SOON</h1>
<div class="sub">The next level of Game‑Z is almost here.</div>
<div class="timer">
<div class="box"><div class="num" id=d>0</div><div class="lbl">DAYS</div></div>
<div class="box"><div class="num" id=h>0</div><div class="lbl">HOURS</div></div>
<div class="box"><div class="num" id=m>0</div><div class="lbl">MINUTES</div></div>
<div class="box"><div class="num" id=s>0</div><div class="lbl">SECONDS</div></div>
</div>
<a href="index.html">🏠 بازگشت به خانه</a>
</div>
<script>
let D=document.getElementById('d'),H=document.getElementById('h'),M=document.getElementById('m'),S=document.getElementById('s');
let target=new Date("2026-10-19T22:30:00").getTime();
setInterval(()=>{let t=Math.max(0,target-Date.now());D.textContent=Math.floor(t/86400000);H.textContent=Math.floor(t%86400000/3600000);M.textContent=Math.floor(t%3600000/60000);S.textContent=Math.floor(t%60000/1000)},1000);
</script></body></html>
