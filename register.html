<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game-Z | ثبت‌نام</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="shortcut icon" href="./logo.png" type="image/x-icon"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <div class="auth-container">
    <img src="./logo.png" alt="Game-Z" class="logo" />
    <h1>ثبت‌نام</h1>
    <div class="sub">به جمع گیم‌رها بپیوندید 🎮</div>

    <form class="auth-form" id="registerForm">
      <input type="text" placeholder="👤 نام کاربری" id="regUser" required />
      <input type="email" placeholder="📧 ایمیل" id="regEmail" required />
      <input type="password" placeholder="🔒 رمز عبور" id="regPass" required minlength="6" />
      <input type="password" placeholder="🔒 تکرار رمز عبور" id="regPass2" required />
      <button type="submit"><i class="fas fa-user-plus"></i> ثبت‌نام</button>
    </form>

    <div class="auth-links">
      قبلاً ثبت‌نام کردید؟ <a href="login.html">ورود</a>
    </div>
    <a href="index.html" class="back-home"><i class="fas fa-arrow-right"></i> بازگشت به خانه</a>
  </div>

  <script src="ui.js"></script>

  <script type="module" src="script.js"></script>
</body>
</html>
